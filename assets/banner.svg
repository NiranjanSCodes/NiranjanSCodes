<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <!-- Accent glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0" />
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Grid overlay -->
  <rect width="900" height="200" fill="url(#grid)" rx="12"/>

  <!-- Ambient glow orbs -->
  <circle cx="150" cy="100" r="80" fill="#2563EB" opacity="0.06"/>
  <circle cx="750" cy="100" r="80" fill="#F59E0B" opacity="0.06"/>

  <!-- Bottom accent line -->
  <rect x="0" y="188" width="900" height="2" fill="url(#accentGrad)" rx="1"/>

  <!-- Top accent line -->
  <rect x="0" y="10" width="900" height="1" fill="url(#accentGrad)" rx="1" opacity="0.5"/>

  <!-- Java brackets decoration - left -->
  <text x="48" y="115" font-family="monospace" font-size="64" fill="#2563EB" opacity="0.12" font-weight="bold">{</text>

  <!-- Java brackets decoration - right -->
  <text x="818" y="115" font-family="monospace" font-size="64" fill="#F59E0B" opacity="0.12" font-weight="bold">}</text>

  <!-- Dot decorations top right -->
  <circle cx="820" cy="30" r="2" fill="#F59E0B" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="834" cy="30" r="2" fill="#F59E0B" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="848" cy="30" r="2" fill="#F59E0B" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Main name - Niranjan Sharma -->
  <text x="450" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700"
        fill="white" text-anchor="middle" letter-spacing="1" filter="url(#glow)">
    Niranjan Sharma
  </text>

  <!-- Accent underline under name -->
  <rect x="290" y="96" width="320" height="2" fill="url(#accentGrad)" rx="1">
    <animate attributeName="width" values="0;320" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x" values="450;290" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Role line -->
  <text x="450" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400"
        fill="#94A3B8" text-anchor="middle" letter-spacing="2">
    BACKEND JAVA DEVELOPER  ·  DAM @ IES ABASTOS, VALENCIA
  </text>

  <!-- Tag pills -->
  <!-- Java pill -->
  <rect x="248" y="148" width="68" height="24" rx="12" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <text x="282" y="164" font-family="monospace" font-size="11" fill="#60A5FA" text-anchor="middle" font-weight="600">Java</text>

  <!-- Maven pill -->
  <rect x="326" y="148" width="68" height="24" rx="12" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="1" opacity="0.4"/>
  <text x="360" y="164" font-family="monospace" font-size="11" fill="#60A5FA" text-anchor="middle" font-weight="600">Maven</text>

  <!-- OOP pill -->
  <rect x="404" y="148" width="68" height="24" rx="12" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <text x="438" y="164" font-family="monospace" font-size="11" fill="#FCD34D" text-anchor="middle" font-weight="600">OOP</text>

  <!-- Git pill -->
  <rect x="482" y="148" width="68" height="24" rx="12" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="1" opacity="0.4"/>
  <text x="516" y="164" font-family="monospace" font-size="11" fill="#60A5FA" text-anchor="middle" font-weight="600">Git</text>

  <!-- Open to work pill -->
  <rect x="560" y="148" width="108" height="24" rx="12" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <circle cx="576" cy="160" r="3" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="625" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#34D399" text-anchor="middle" font-weight="600">Open to Work</text>

</svg>
