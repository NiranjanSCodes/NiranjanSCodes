<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#111113"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#09090B;stop-opacity:1"/>
      <stop offset="20%"  style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="80%"  style="stop-color:#F59E0B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#09090B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  style="stop-color:#09090B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#09090B;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  style="stop-color:#09090B;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#09090B;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#27272A"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="180" fill="url(#bg)" rx="10"/>

  <!-- Dot grid -->
  <rect width="900" height="180" fill="url(#dots)" rx="10" opacity="0.8"/>

  <!-- Left fade over dots -->
  <rect width="180" height="180" fill="url(#fadeLeft)" rx="10"/>
  <!-- Right fade over dots -->
  <rect x="720" width="180" height="180" fill="url(#fadeRight)"/>

  <!-- Ambient glow: blue left -->
  <ellipse cx="180" cy="90" rx="160" ry="70" fill="#2563EB" opacity="0.04"/>
  <!-- Ambient glow: amber right -->
  <ellipse cx="720" cy="90" rx="160" ry="70" fill="#F59E0B" opacity="0.04"/>

  <!-- Top hairline -->
  <rect x="0" y="0" width="900" height="1" fill="url(#lineGrad)" opacity="0.4"/>

  <!-- Bottom accent line — the signature element -->
  <rect x="0" y="177" width="900" height="2" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Vertical rule left -->
  <rect x="64" y="32" width="1" height="116" fill="#2563EB" opacity="0.3"/>

  <!-- Left bracket detail -->
  <rect x="64" y="32" width="12" height="1" fill="#2563EB" opacity="0.5"/>
  <rect x="64" y="148" width="12" height="1" fill="#2563EB" opacity="0.5"/>

  <!-- Name — left-aligned, monospace, confident -->
  <text x="92" y="82"
        font-family="'SF Mono','Fira Code','Consolas',monospace"
        font-size="34" font-weight="700"
        fill="#FAFAFA"
        filter="url(#subtleglow)"
        letter-spacing="-0.5">Niranjan Sharma</text>

  <!-- Blinking cursor after name -->
  <rect x="444" y="56" width="3" height="30" fill="#2563EB" rx="1">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Role — muted, smaller, spaced -->
  <text x="93" y="110"
        font-family="'SF Mono','Fira Code','Consolas',monospace"
        font-size="13" font-weight="400"
        fill="#71717A"
        letter-spacing="1.5">BACKEND JAVA · DAM @ IES ABASTOS · VALENCIA, ES</text>

  <!-- Status pill — right side -->
  <rect x="718" y="74" width="126" height="28" rx="14"
        fill="#09090B" stroke="#166534" stroke-width="1"/>
  <circle cx="736" cy="88" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="748" y="93"
        font-family="'SF Mono','Fira Code','Consolas',monospace"
        font-size="11" fill="#22C55E" font-weight="500">Open to work</text>

  <!-- Language tags — bottom left, minimal -->
  <text x="93" y="142"
        font-family="'SF Mono','Fira Code','Consolas',monospace"
        font-size="10" fill="#3F3F46" letter-spacing="2">EN · ES · नेपाली</text>

  <!-- Subtle right decoration: stacked horizontal rules -->
  <rect x="680" y="112" width="40" height="1" fill="#F59E0B" opacity="0.4"/>
  <rect x="692" y="118" width="28" height="1" fill="#F59E0B" opacity="0.25"/>
  <rect x="700" y="124" width="20" height="1" fill="#F59E0B" opacity="0.15"/>

</svg>
