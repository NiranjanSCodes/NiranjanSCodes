name: Update GitHub Profile

on:
  schedule:
    # Runs every day at 08:00 UTC (09:00 Spain time)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  update-profile:
    runs-on: ubuntu-latest
    name: Update Profile README

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify README exists
        run: |
          if [ -f README.md ]; then
            echo "✅ README.md found"
            echo "📏 Lines: $(wc -l < README.md)"
          else
            echo "❌ README.md not found"
            exit 1
          fi

      - name: Verify assets exist
        run: |
          echo "📁 Assets in repository:"
          ls -la assets/ || echo "No assets folder found"

      - name: Check last commit info
        run: |
          echo "📅 Last commit: $(git log -1 --format='%ci')"
          echo "👤 Author: $(git log -1 --format='%an')"
          echo "💬 Message: $(git log -1 --format='%s')"
