name: Validate Profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README exists and has content
        run: |
          [ -f README.md ] || (echo "README.md missing" && exit 1)
          LINES=$(wc -l < README.md)
          [ "$LINES" -gt 20 ] || (echo "README too short ($LINES lines)" && exit 1)
          echo "README OK — $LINES lines"

      - name: Check required sections exist
        run: |
          grep -q "mini-ai-assistant"    README.md || (echo "Missing: mini-ai-assistant" && exit 1)
          grep -q "banking-system-java"  README.md || (echo "Missing: banking-system-java" && exit 1)
          grep -q "linkedin.com"         README.md || (echo "Missing: LinkedIn link" && exit 1)
          grep -q "assets/banner.svg"    README.md || (echo "Missing: banner" && exit 1)
          echo "All required sections present"

      - name: Check banner SVG exists
        run: |
          [ -f assets/banner.svg ] || (echo "banner.svg missing from assets/" && exit 1)
          echo "Assets OK"

      - name: Summary
        run: |
          echo "Profile README is valid and complete."
